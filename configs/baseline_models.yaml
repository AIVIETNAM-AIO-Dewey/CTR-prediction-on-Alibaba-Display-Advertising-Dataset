# ==============================================================================
# CTR Prediction - Baseline Models Configuration
# ==============================================================================

# Data Paths
paths:
  processed_dir: "data/processed"
  models_dir: "models"
  results_output: "experiments/baseline_results.json"

# Features Configuration
features:
  target: "clk"
  exclude_cols:
    - "clk"
    - "nonclk"
    - "datetime"
    - "date"
    - "time_stamp"
    - "user"

  categorical:
    - "pid"
    - "final_gender_code"
    - "age_level"
    - "pvalue_level"
    - "shopping_level"
    - "occupation"
    - "new_user_class_level"
    - "cms_segid"
    - "cms_group_id"
    - "cate_id"
    - "brand"
    - "customer"
    - "campaign_id"
    - "adgroup_id"
    - "is_weekend"
    - "day_of_week"
    - "hour"

  numeric:
    - "price"

# Logistic Regression Baseline Hyperparameters
logistic_regression:
  C: 1.0
  penalty: "l2"
  solver: "lbfgs"
  max_iter: 300
  max_categories_per_feature: 200
  min_category_frequency: 10
  use_sgd: false
  random_state: 42

# LightGBM Baseline Hyperparameters
lightgbm:
  objective: "binary"
  boosting_type: "gbdt"
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_estimators: 1000
  early_stopping_rounds: 50
  scale_pos_weight: 1.0
  metric:
    - "binary_logloss"
    - "auc"
  random_state: 42
  n_jobs: -1
